function normalizeImported(obj){

    obj.meta.timeframes=obj.meta.timeframes||Object.keys(obj.frames);

    const frame={measuredAt:obj.measuredAt||"—",quality:obj.quality||"MANUAL",marketState:obj.marketState||"—",observationNeed:obj.observationNeed||"—",briefing:obj.briefing||"",cards:obj.cards};
    const merged=structuredClone(DATA);
    merged.meta=merged.meta||{};merged.frames=merged.frames||{};
    merged.meta.source="MANUAL";merged.meta.symbol=obj.symbol||merged.meta.symbol||"OKX:BTCUSDT.P";

function filename(){
  const tf=tfs[index],d=new Date(),p=n=>String(n).padStart(2,"0");
  return `LYNX_BTC_${tf}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
}
async function capturePng(){
  if(typeof html2canvas!=="function"){toast("캡처 라이브러리를 불러오지 못했습니다.");return}
  document.body.classList.add("capturing");toast("이미지를 만드는 중입니다…");
  try{
    await new Promise(r=>setTimeout(r,180));
    const canvas=await html2canvas($("captureArea"),{backgroundColor:"#050809",scale:Math.min(2.5,window.devicePixelRatio||2),useCORS:true,logging:false});
    const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    if(!blob)throw new Error("PNG 생성 실패");
    const file=new File([blob],filename(),{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`AiLynx ${tfs[index]}`,text:"AiLynx BTC Timeframe Viewer"});
      toast("공유 화면을 열었습니다.");
    }else{
      const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("PNG 저장 요청을 보냈습니다.");
    }
  }catch(e){if(e?.name!=="AbortError")toast("PNG 생성 또는 공유에 실패했습니다.")}
  finally{document.body.classList.remove("capturing")}
}
