const $=id=>document.getElementById(id);
const tfs=DATA.meta.timeframes.filter(tf=>DATA.frames[tf]);
let index=Math.max(0,tfs.indexOf("4H"));
const tone=t=>t||"";
const esc=v=>String(v??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function buttons(){
  $("tfbuttons").innerHTML="";
  tfs.forEach((tf,i)=>{const b=document.createElement("button");b.className="tfbtn";b.textContent=tf;b.onclick=()=>{index=i;render()};$("tfbuttons").appendChild(b)})
}
function card(c,i){
  return `<article class="card"><header class="cardhead"><div class="titlewrap"><span class="idx">${i+1}</span><h2>${esc(c.title)}</h2></div><span class="state ${tone(c.tone)}">${esc(c.state)}</span></header><table><tbody>${c.rows.map(r=>`<tr><th>${esc(r[0])}</th><td class="${tone(r[2])}">${esc(r[1])}</td></tr>`).join("")}</tbody></table></article>`
}
function render(){
  const tf=tfs[index],f=DATA.frames[tf];
  $("symbol").textContent=DATA.meta.symbol;$("selectedTf").textContent=tf;$("measured").textContent=f.measuredAt;$("quality").textContent=f.quality;$("marketState").textContent=f.marketState;$("need").textContent=f.observationNeed;$("brief").textContent=f.briefing;$("stamp").textContent=tf+" · "+f.measuredAt;$("grid").innerHTML=f.cards.map(card).join("");
  [...$("tfbuttons").children].forEach((b,i)=>{b.classList.toggle("active",i===index);if(i===index)b.scrollIntoView({block:"nearest",inline:"center"})})
}
function move(n){index=(index+n+tfs.length)%tfs.length;render();window.scrollTo({top:0,behavior:"smooth"})}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
buttons();render();
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("captureBtn").onclick=()=>{document.body.classList.toggle("capture");toast(document.body.classList.contains("capture")?"캡처 모드입니다. 휴대폰 기본 스크린샷을 사용하세요.":"일반 모드로 돌아왔습니다.")};
